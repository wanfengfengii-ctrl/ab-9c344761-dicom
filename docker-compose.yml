services:
  api:
    build: .
    image: dicom-frames-api
    ports:
      # APP_PORT selects the host port; the container always listens on 8000.
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  verify:
    image: dicom-frames-api
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
    command: ["python", "-m", "verify.run"]
    restart: "no"
